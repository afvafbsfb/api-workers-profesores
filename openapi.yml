
openapi: 3.0.1
info:
  title: Workers API (staging)
  version: "0.1.0"
servers:
  - url: /
security:
  - api_key: []
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  /vlodeiro/secretaria/turnos_libres:
    get:
      summary: Lista todos los turnos con plazas libres
      responses:
        "200":
          description: Lista de turnos con plazas libres

  /vlodeiro/secretaria/inscribir:
    post:
      summary: Inscribe un alumno en un turno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alumno_id, turno_id, tarifa_id]
              properties:
                alumno_id:
                  type: integer
                turno_id:
                  type: integer
                tarifa_id:
                  type: integer
      responses:
        "200":
          description: Alumno inscrito correctamente
        "400":
          description: Error al inscribir alumno

  /vlodeiro/secretaria/registrar_pago:
    post:
      summary: Registra un pago para un alumno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alumno_id, importe, concepto]
              properties:
                alumno_id:
                  type: integer
                importe:
                  type: number
                concepto:
                  type: string
      responses:
        "200":
          description: Pago registrado correctamente
        "400":
          description: Error al registrar pago

  /vlodeiro/secretaria/turnos:
    get:
      summary: Lista todos los turnos activos de la empresa
      responses:
        "200":
          description: Lista de turnos activos

  /vlodeiro/secretaria/tarifas:
    get:
      summary: Lista todas las tarifas
      responses:
        "200":
          description: Lista de tarifas
    post:
      summary: Crea una tarifa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [empresa_id, descripcion, duracion_min, precio_base]
              properties:
                empresa_id:
                  type: integer
                descripcion:
                  type: string
                duracion_min:
                  type: integer
                precio_base:
                  type: number
                descuento:
                  type: number
                activo:
                  type: boolean
      responses:
        "201":
          description: Tarifa creada

  /vlodeiro/secretaria/tarifas/{tarifa_id}:
    put:
      summary: Actualiza una tarifa
      parameters:
        - in: path
          name: tarifa_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Tarifa actualizada
        "404":
          description: Tarifa no encontrada
    delete:
      summary: Elimina una tarifa
      parameters:
        - in: path
          name: tarifa_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tarifa eliminada
        "404":
          description: Tarifa no encontrada

  /vlodeiro/secretaria/turnos/{turno_id}/alumnos:
    get:
      summary: Lista alumnos inscritos (activos) en un turno
      parameters:
        - in: path
          name: turno_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista de alumnos en el turno

  /vlodeiro/secretaria/inscripciones/{inscripcion_id}/baja:
    post:
      summary: Da de baja (fecha_fin = hoy) una inscripción
      parameters:
        - in: path
          name: inscripcion_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inscripción dada de baja
        "404":
          description: Inscripción no encontrada

  /vlodeiro/secretaria/alumnos:
    get:
      summary: Lista todos los alumnos
      responses:
        "200":
          description: Lista de alumnos

  /vlodeiro/secretaria/alumnos/{alumno_id}:
    get:
      summary: Obtiene los datos de un alumno por su ID
      parameters:
        - in: path
          name: alumno_id
          schema:
            type: integer
          required: true
          description: ID del alumno
      responses:
        "200":
          description: Datos del alumno
        "404":
          description: Alumno no encontrado

  /vlodeiro/secretaria/alumnos/buscar:
    get:
      summary: Busca alumnos por nombre (coincidencia parcial)
      parameters:
        - in: query
          name: nombre
          required: true
          schema:
            type: string
          description: Texto a buscar en el nombre
      responses:
        "200":
          description: Lista de alumnos que coinciden
        "400":
          description: Falta parámetro 'nombre'

  /vlodeiro/empresa/empresa:
    post:
      summary: Crea una nueva empresa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                usuarios:
                  type: array
                  items:
                    type: string
                config:
                  type: object
      responses:
        "201":
          description: Empresa creada correctamente
        "400":
          description: El nombre es obligatorio

    get:
      summary: Lista todas las empresas
      responses:
        "200":
          description: Lista de empresas

  /vlodeiro/empresa/empresa/{empresa_id}:
    get:
      summary: Obtiene los datos de una empresa por su ID
      parameters:
        - in: path
          name: empresa_id
          schema:
            type: string
          required: true
          description: ID de la empresa
      responses:
        "200":
          description: Datos de la empresa
        "404":
          description: Empresa no encontrada

components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-Api-Key