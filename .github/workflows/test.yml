name: CI - Tests

on:
  push:
    branches: [ main, master, ampliacion-proyecto ]
  pull_request:
    branches: [ main, master, ampliacion-proyecto ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_ENV: developmentAWS
      DB_HOST: api-workers-dev.cvwcguygomlv.eu-west-3.rds.amazonaws.com
      DB_PORT: 3306
      DB_USER: admin
      DB_PASS: Abanca0795
      DB_NAME: api_workers
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # Ensure apispec is available for generating OpenAPI
          python -m pip install "apispec[marshmallow]"
          # PyYAML is used by scripts/compare_openapi.py for YAML parsing
          python -m pip install pyyaml

      - name: Run DB seeder (idempotente)
        # Only run the DB seeder manually on main/master via workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "Running DB seeder (this will fail the job if seeder raises an error)"
          python init_db_pruebas_test.py --reset

      - name: Verify seeded data (counts)
        # Only verify seeded data manually on main/master via workflow_dispatch
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          python - <<'PY'
          from config import Config
          Config.set_environment_variables()
          from main import app
          from src.shared.database import db
          from src.usuarios.infrastructure.models import Usuario, Rol
          from src.academias.infrastructure.models import Academia
          with app.app_context():
            print('DB URL:', Config.get_database_config())
            try:
              usuarios = db.session.query(Usuario).count()
            except Exception as e:
              print('Error counting Usuario:', e)
              raise
            try:
              roles = db.session.query(Rol).count()
            except Exception as e:
              print('Error counting Rol:', e)
              raise
            try:
              academias = db.session.query(Academia).count()
            except Exception as e:
              print('Error counting Academia:', e)
              raise
            print(f'Counts -> Usuario: {usuarios}, Rol: {roles}, Academia: {academias}')
          PY

      - name: Run tests (ordered) and produce combined HTML report
        # Run tests only when manually dispatched on main/master (avoid running on merge automatically)
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          echo "Running ordered tests against AWS RDS and generating combined HTML report"
          python -m pytest \
            tests/academias/test_altas_bajas_academias.py \
            tests/academias/test_busquedas_academias.py \
            tests/academias/test_academias_post.py \
            tests/academias/test_academias_get_patch.py \
            tests/usuarios/test_jwt_claims.py \
            tests/usuarios/test_altas_bajas_usuarios.py \
            tests/usuarios/test_busquedas_usuarios.py \
            tests/usuarios/test_login.py \
            tests/usuarios/test_unblock.py \
            tests/usuarios/test_refresh_logout.py \
            -q -s --html=report-all.html --self-contained-html

      - name: Upload pytest HTML report
        # Only upload the pytest report when tests actually ran via manual dispatch on main/master
        if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report-all.html

      - name: Regenerate OpenAPI (dump_openapi.py)
        run: |
          python scripts/dump_openapi.py

      - name: Sync root spec files (optional)
        run: |
          if [ -f docs/openapi-auto.json ]; then cp docs/openapi-auto.json openapi.json || true; fi
          if [ -f docs/openapi-auto.yml ]; then cp docs/openapi-auto.yml openapi.yml || true; fi

      - name: Upload generated OpenAPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-openapi
          path: |
            docs/openapi-auto.json
            docs/openapi-auto.yml
            openapi.json
            openapi.yml

      # OpenAPI semantic equality check removed per request (was causing CI failures)
