name: CI - Tests

on:
  push:
    branches: [ main, master, ampliacion-proyecto ]
  pull_request:
    branches: [ main, master, ampliacion-proyecto ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test_ci.db
      DB_ENV: ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run DB seeder (idempotente)
        run: |
          python init_db_pruebas_test.py --reset || true

      - name: Run tests
        run: |
          python -m pytest -q
      
      - name: Upload sqlite DB for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_ci_db
          path: ./test_ci.db
