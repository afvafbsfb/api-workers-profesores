name: CI - Tests

on:
  push:
    branches: [ main, master, ampliacion-proyecto ]
  pull_request:
    branches: [ main, master, ampliacion-proyecto ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_ENV: developmentAWS
      DB_HOST: api-workers-dev.cvwcguygomlv.eu-west-3.rds.amazonaws.com
      DB_PORT: 3306
      DB_USER: admin
      DB_PASS: Abanca0795
      DB_NAME: api_workers
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run DB seeder (idempotente)
        run: |
          echo "Running DB seeder (this will fail the job if seeder raises an error)"
          python init_db_pruebas_test.py --reset

      - name: Verify seeded data (counts)
        run: |
          python - <<'PY'
          from config import Config
          Config.set_environment_variables()
          from main import app
          from models import db, Usuario, Rol, Academia
          with app.app_context():
              print('DB URL:', Config.get_database_config())
              try:
                  usuarios = db.session.query(Usuario).count()
              except Exception as e:
                  print('Error counting Usuario:', e)
                  raise
              try:
                  roles = db.session.query(Rol).count()
              except Exception as e:
                  print('Error counting Rol:', e)
                  raise
              try:
                  academias = db.session.query(Academia).count()
              except Exception as e:
                  print('Error counting Academia:', e)
                  raise
              print(f'Counts -> Usuario: {usuarios}, Rol: {roles}, Academia: {academias}')
          PY

      - name: Run tests (ordered) and produce combined HTML report
        run: |
          echo "Running ordered tests against AWS RDS and generating combined HTML report"
          python init_db_pruebas_test.py --reset
          python -m pytest \
            tests/academias/test_academias_get_patch.py \
            tests/academias/test_academias_post.py \
            tests/usuarios/test_login.py \
            tests/usuarios/test_unblock.py \
            tests/usuarios/test_refresh_logout.py \
            -q -s --html=report-all.html --self-contained-html || true

      - name: Upload pytest HTML report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report-all.html
