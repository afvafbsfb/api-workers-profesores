name: CI/CD workers-api

on:
  push:
    branches: [staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install development dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests (ordered) and produce combined HTML report
        run: |
          echo "Running ordered tests against AWS RDS and generating combined HTML report"
          python init_db_pruebas_test.py --reset
          python -m pytest \
            tests/academias/test_altas_bajas_academias.py \
            tests/academias/test_busquedas_academias.py \
            tests/academias/test_academias_post.py \
            tests/academias/test_academias_get_patch.py \
            tests/usuarios/test_jwt_claims.py \
            tests/usuarios/test_altas_bajas_usuarios.py \
            tests/usuarios/test_busquedas_usuarios.py \
            tests/usuarios/test_login.py \
            tests/usuarios/test_unblock.py \
            tests/usuarios/test_refresh_logout.py \
            -q -s --html=report-all.html --self-contained-html

      - name: Upload pytest HTML report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report-all.html
      - name: Lint
        run: flake8 . || echo "Lint warnings"
    env:
      DB_ENV: developmentAWS
      DB_HOST: api-workers-dev.cvwcguygomlv.eu-west-3.rds.amazonaws.com
      DB_PORT: 3306
      DB_USER: admin
      DB_PASS: Abanca0795
      DB_NAME: api_workers

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Deploy to cPanel (manual step)
        run: |
          echo "Haz deploy en cPanel: Git Version Control -> Deploy HEAD Commit"
