name: CI/CD workers-api

on:
  push:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install development dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests (ordered)
        run: |
          echo "Running ordered tests against AWS RDS"
          # Run tests in the explicit order required by CI
          python -m pytest tests/academias/test_academias_routes.py -q -s
          python -m pytest tests/usuarios/test_login.py -q -s
          python -m pytest tests/usuarios/test_unblock.py -q -s
          python -m pytest tests/usuarios/test_refresh_logout.py -q -s
      - name: Lint
        run: flake8 . || echo "Lint warnings"
    env:
      DB_ENV: developmentAWS
      DB_HOST: api-workers-dev.cvwcguygomlv.eu-west-3.rds.amazonaws.com
      DB_PORT: 3306
      DB_USER: admin
      DB_PASS: Abanca0795
      DB_NAME: api_workers

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    steps:
      - name: Deploy to cPanel (manual step)
        run: |
          echo "Haz deploy en cPanel: Git Version Control -> Deploy HEAD Commit"
