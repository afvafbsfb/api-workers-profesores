name: Validate OpenAPI spec

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  validate-openapi:
    name: Regenerate and validate OpenAPI
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: '.'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Regenerate OpenAPI (dump_openapi.py)
        run: |
          python scripts/dump_openapi.py

      - name: Sync root spec files (if present)
        run: |
          # Copy generated docs into repo root so we validate the files you serve at /
          if [ -f docs/openapi-auto.json ]; then cp docs/openapi-auto.json openapi.json || true; fi
          if [ -f docs/openapi-auto.yml ]; then cp docs/openapi-auto.yml openapi.yml || true; fi

      - name: Check for uncommitted changes in spec files
        run: |
          git --no-pager status --porcelain
          # Fail if any of the canonical spec files changed after regeneration
          git diff --exit-code -- docs/openapi-auto.json docs/openapi-auto.yml openapi.json openapi.yml

      - name: Print success
        if: success()
        run: echo "OpenAPI files are up-to-date with the code (docs/openapi-auto.json and openapi-auto.yml match committed files)"
