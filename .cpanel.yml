deployment:
  tasks:
    - export DOCROOT=/home/s018fbe6/workers-api
    - export REPO=/home/s018fbe6/repos/workers-api

    # Copia código pero NO borres .htaccess ni .cpanel.yml ni requirements
    - /bin/rsync -a --delete \
      --exclude='.git*' --exclude='.github' \
      --exclude='.cpanel.yml' --exclude='.htaccess' \
      --exclude='requirements.txt' \
      ./ $DOCROOT/

    # (Si versionas .htaccess en el repo, sobreescríbelo encima)
    - /bin/test -f ./.htaccess && /bin/cp -f ./.htaccess $DOCROOT/.htaccess || true

    # Instala dependencias desde el repo
    - /usr/bin/env bash -lc '/home/s018fbe6/virtualenv/workers-api/3.7/bin/pip install -r $REPO/requirements.txt || true'

    # Marca build y fuerza reload de reglas/Passenger
    - /usr/bin/env bash -lc 'git -C $REPO rev-parse --short HEAD > $DOCROOT/.build || true'
    - /bin/mkdir -p $DOCROOT/tmp
    - /bin/touch $DOCROOT/.htaccess || true
    - /bin/touch $DOCROOT/tmp/restart.txt
