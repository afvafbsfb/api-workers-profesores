deployment:
  tasks:
    - export DOCROOT=/home/s018fbe6/workers-api

    # No dejes al docroot sin .htaccess (Passenger)
    - /bin/rsync -a --delete --exclude='.git*' --exclude='.github' --exclude='.htaccess' ./ $DOCROOT/
    # Si versionas .htaccess, cópialo encima (sin borrar)
    - /bin/test -f ./.htaccess && /bin/cp -f ./.htaccess $DOCROOT/.htaccess || true

    # Dependencias
    - /usr/bin/env bash -lc '/home/s018fbe6/virtualenv/workers-api/3.7/bin/pip install -r $DOCROOT/requirements.txt || true'

    # Marcar build y recargar servidor
    - /usr/bin/env bash -lc 'git -C /home/s018fbe6/repos/workers-api rev-parse --short HEAD > $DOCROOT/.build || true'
    - /bin/mkdir -p $DOCROOT/tmp
    - /bin/touch $DOCROOT/.htaccess || true
    - /bin/touch $DOCROOT/tmp/restart.txt