deployment:
  tasks:
    # Copiar código al docroot sin tocar archivos críticos
    - /bin/rsync -a --delete --exclude='.git*' --exclude='.github' --exclude='.cpanel.yml' --exclude='.htaccess' --exclude='requirements.txt' ./ /home/s018fbe6/workers-api/

    # (Re)crear SIEMPRE un .htaccess válido de Passenger
    - /usr/bin/env bash -lc 'cat > /home/s018fbe6/workers-api/.htaccess << "EOF"
# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN
PassengerAppRoot "/home/s018fbe6/workers-api"
PassengerBaseURI "/"
PassengerPython "/home/s018fbe6/virtualenv/workers-api/3.7/bin/python"
# DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END
# DO NOT REMOVE OR MODIFY. CLOUDLINUX ENV VARS CONFIGURATION BEGIN
<IfModule Litespeed>
SetEnv API_KEY dominique2013
</IfModule>
# DO NOT REMOVE OR MODIFY. CLOUDLINUX ENV VARS CONFIGURATION END
EOF'

    # Instalar dependencias desde el repo (no desde el docroot)
    - /usr/bin/env bash -lc '/home/s018fbe6/virtualenv/workers-api/3.7/bin/pip install -r /home/s018fbe6/repos/workers-api/requirements.txt || true'

    # Marcar build y forzar reload de Passenger
    - /usr/bin/env bash -lc 'git -C /home/s018fbe6/repos/workers-api rev-parse --short HEAD > /home/s018fbe6/workers-api/.build || true'
    - /bin/mkdir -p /home/s018fbe6/workers-api/tmp
    - /bin/touch /home/s018fbe6/workers-api/tmp/restart.txt
