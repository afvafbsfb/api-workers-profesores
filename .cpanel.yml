# Sustituye {USER} por tu usuario real de cPanel.
# Si tu Python menor cambia (p. ej. 3.11), ajusta la ruta del virtualenv.
deployment:
  tasks:
    - export DOCROOT=/home/{USER}/public_html2/api
    - /bin/rsync -a --delete --exclude='.git*' --exclude='.github' ./ $DOCROOT/
    - /usr/bin/env bash -lc '/home/{USER}/virtualenv/public_html2/api/3.11/bin/pip install -r $DOCROOT/requirements.txt || true'
    - /bin/mkdir -p $DOCROOT/tmp
    - /bin/touch $DOCROOT/tmp/restart.txt
