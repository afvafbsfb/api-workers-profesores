<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swagger UI - OpenAPI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@4/swagger-ui.css" />
    <style>
      html, body { height: 100%; margin: 0; }
      #swagger-ui { height: 100vh; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@4/swagger-ui-bundle.js"></script>
    <script>
      // Use a single canonical spec URL. We serve the spec at /openapi.json
      // from the Flask app (or fall back to docs/openapi-auto.json). This
      // is simpler and reliable for local development and CI-generated docs.
      const SPEC_URL = '/openapi.json';

      SwaggerUIBundle({
        url: SPEC_URL,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: 'BaseLayout',
        requestInterceptor: (req) => {
          try {
            const url = new URL(req.url, window.location.href);
            const staticOrigin = window.location.origin;
            const backendOrigin = 'http://localhost:5000';
            // If Swagger UI is being served from a static server (different origin),
            // rewrite same-origin API calls to the local backend for "Try it out".
            if (url.origin === staticOrigin) {
              req.url = backendOrigin + url.pathname + url.search;
            }
          } catch (e) {
            console.warn('requestInterceptor error', e);
          }
          return req;
        }
      });
    </script>
  </body>
</html>
