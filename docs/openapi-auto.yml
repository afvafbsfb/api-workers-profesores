components:
  schemas:
    Academia:
      additionalProperties: false
      properties:
        direccion:
          type: string
        id:
          readOnly: true
          type: integer
        nombre:
          type: string
        telefono:
          type: string
      required:
      - nombre
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        password:
          type: string
      required:
      - email
      - password
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        name:
          type: string
        role:
          type: string
        tokens:
          additionalProperties: {}
          type: object
      type: object
    Rol:
      additionalProperties: false
      properties:
        id:
          readOnly: true
          type: integer
        nombre:
          type: string
      type: object
    Usuario:
      additionalProperties: false
      properties:
        academia_id:
          nullable: true
          type: integer
        email:
          format: email
          type: string
        estado:
          type: string
        fecha_alta:
          format: date-time
          type: string
        id:
          readOnly: true
          type: integer
        nombre:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
