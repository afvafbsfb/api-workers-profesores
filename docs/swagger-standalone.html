<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Workers - Documentación OpenAPI</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        // Cargar el spec desde el archivo JSON local
        fetch('openapi-auto.json')
            .then(response => response.json())
            .then(spec => {
                window.ui = SwaggerUIBundle({
                    spec: spec,
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                    ],
                    layout: "StandaloneLayout"
                });
            })
            .catch(err => {
                console.error('Error loading OpenAPI spec:', err);
                document.getElementById('swagger-ui').innerHTML = 
                    '<h2>Error: No se pudo cargar la especificación OpenAPI</h2>' +
                    '<p>Asegúrate de que el archivo openapi-auto.json está en el mismo directorio.</p>';
            });
    </script>
</body>
</html>
